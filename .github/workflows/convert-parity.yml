name: Convert + parity (Core ML gate)

# Phase 4: runner-side conversion + numerical parity — kills bad conversions
# WITHOUT burning an install cycle. Manual dispatch only (a ~700 MB model
# download + a 256 MB fp16 conversion per run); see
# Docs/PHASE2-OP-INVENTORY-PLACEMENT.md §9 and Scripts/convert_parity.py.
#
# Parts: A = Kokoro via ORT CoreML EP vs CPU (H1/H3 runner edition);
# B = Supertonic-3 chain via the EP (the fallback path);
# C = Supertonic-3 direct coremltools fp16 conversion + chain parity +
#     coremlcompiler compile — THE shipping-path gate; only C fails the job.

on:
  workflow_dispatch:
  # Registered workflows need the file on the default branch for API
  # dispatch from a feature branch; until then, a push that TOUCHES the
  # experiment's own files is the trigger. The filter means ordinary code
  # pushes never run this job — only intentional experiment changes do.
  push:
    branches: [batch-c-d-session]
    paths:
      - "Scripts/convert_parity.py"
      - ".github/workflows/convert-parity.yml"

jobs:
  convert-parity:
    name: Convert Supertonic-3 + CoreML EP parity
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain
        run: |
          python -m pip install --upgrade pip
          pip install "coremltools==9.0" "onnxruntime==1.24.2" "numpy"

      - name: Convert + parity
        run: |
          set -o pipefail
          PARITY_WORK="$GITHUB_WORKSPACE/parity-work" python Scripts/convert_parity.py 2>&1 | tee parity.log

      - name: Show failure summary
        if: always()
        run: |
          echo "### Convert + parity outcome" >> "$GITHUB_STEP_SUMMARY"
          if [ -f parity-work/parity-report.json ]; then
            python - <<'EOF'
          import json
          report = json.load(open("parity-work/parity-report.json"))
          for part, r in report.items():
              if r is None:
                  print(f"- {part}: not run")
              elif r.get("pass") is True:
                  print(f"- {part}: PASS " + json.dumps({k: r[k] for k in ("pearson", "rel_rms", "length_delta") if k in r}))
              else:
                  print(f"- {part}: FAIL " + json.dumps(r.get("reason") or r.get("error") or r, default=str)[:400])
          EOF
          else
            echo "No report produced — see parity.log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: convert-parity
          path: |
            parity-work/parity-report.json
            parity.log
            parity-work/supertonic/mlmodelc/
          retention-days: 14
