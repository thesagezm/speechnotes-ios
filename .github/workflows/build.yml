name: Build IPA

on:
  push:
    branches: [main, bisect-g]
  workflow_dispatch:

jobs:
  logic-tests:
    name: Logic tests (chunker + WAV writer)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SpeechLogic package tests
        run: |
          set -o pipefail
          cd Packages/SpeechLogic
          swift test 2>&1 | tee ../../logic-tests.log

      - name: Show failure summary
        if: failure()
        run: |
          grep -E "error:|failed|XCTAssert" logic-tests.log | tail -n 30 > summary.txt || true
          echo "----- LOGIC TEST FAILURE SUMMARY (last 30 matching lines) -----"
          cat summary.txt
          echo "-------------------------------------------------------------------"
          if [ -s summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('summary.txt').read_text()[:5500]; print('::error title=Logic tests failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Upload logic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-tests-log
          path: logic-tests.log
          if-no-files-found: warn

  # Retired 2026-08-16 (v0.8.2): the kokoro-spike job (MLX Metal generation
  # under `swift test`) never got past mlx's metallib loading on the runner —
  # the xctest runner doesn't expose the bundle where mlx looks for it, and
  # copying default.metallib + mlx-swift_Cmlx.bundle into the xctest Resources
  # didn't help either. It tested the Metal path v0.7.0 removed from the app;
  # kitten-spike (ONNX) is the live contract test. Package archived in git
  # history (Tests/KokoroSpike, removed in the same commit).

  kitten-spike:
    name: Kitten spike (validates ONNX contract)
    runs-on: macos-latest
    timeout-minutes: 15
    # Informative and non-blocking by design (the phone is the real bench)
    # — but read this job's results via the API before trusting the engine.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Kitten model + extract voice vector
        run: |
          mkdir -p ~/kitten-spike
          curl -L --retry 3 --progress-bar \
            -o ~/kitten-spike/model.onnx \
            "https://huggingface.co/KittenML/kitten-tts-mini-0.8/resolve/main/kitten_tts_mini_v0_8.onnx"
          curl -L --retry 3 --progress-bar \
            -o /tmp/kitten-voices.npz \
            "https://huggingface.co/KittenML/kitten-tts-mini-0.8/resolve/main/voices.npz"
          # mini-0.8 stores a [400, 256] float32 style matrix per voice —
          # extract row 0 as the raw vector the engine would select for
          # short inputs, keeping the spike free of npz/MLX dependencies.
          python3 -c "
          import zipfile, struct, os
          z = zipfile.ZipFile('/tmp/kitten-voices.npz')
          data = z.read('expr-voice-5-m.npy')
          hlen = int.from_bytes(data[8:10], 'little')
          body = data[10 + hlen:]
          assert len(body) == 400 * 256 * 4, len(body)
          row = body[:256 * 4]
          print('CI voice head:', ', '.join(f'{v:.4f}' for v in struct.unpack('<4f', row[:16])))
          open(os.path.expanduser('~/kitten-spike/voice.f32'), 'wb').write(row)
          "
          ls -lh ~/kitten-spike

      - name: Run Kitten spike test
        run: |
          set -o pipefail
          cd Tests/KittenSpike
          swift test 2>&1 | tee ../../kitten-spike.log

      - name: Show failure summary
        if: always()
        run: |
          grep -E "KITTEN-SPIKE|error:|failed|Fatal|Crash|unexpected exit|Executed" kitten-spike.log \
            | grep -vE "warning:" \
            | tail -n 40 > kitten-summary.txt || true
          echo "----- KITTEN SPIKE SUMMARY -----"
          cat kitten-summary.txt
          echo "--------------------------------"
          if [ -s kitten-summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('kitten-summary.txt').read_text()[:5500]; print('::error title=Kitten spike failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Upload sample audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kitten-sample
          path: ~/kitten-spike/sample.wav
          if-no-files-found: error

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kitten-spike-log
          path: kitten-spike.log
          if-no-files-found: warn

  supertonic-spike:
    name: Supertonic spike (validates ONNX contract)
    runs-on: macos-latest
    timeout-minutes: 20
    # Informative and non-blocking by design (matches kitten-spike; the phone
    # is the real bench) — but read this job's results via the API before
    # trusting the engine. This spike is the RSS gate for the A14 device.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Supertonic model assets
        run: |
          mkdir -p ~/supertonic-spike/onnx ~/supertonic-spike/voice_styles
          BASE="https://huggingface.co/Supertone/supertonic-3/resolve/main"
          for f in duration_predictor.onnx text_encoder.onnx vector_estimator.onnx vocoder.onnx tts.json unicode_indexer.json; do
            curl -L --retry 3 --progress-bar -o ~/supertonic-spike/onnx/$f "$BASE/onnx/$f"
          done
          for v in M1 F1; do
            curl -L --retry 3 --progress-bar -o ~/supertonic-spike/voice_styles/$v.json "$BASE/voice_styles/$v.json"
          done
          ls -lh ~/supertonic-spike/onnx ~/supertonic-spike/voice_styles

      - name: Copy vendored Helper.swift into the spike package
        run: |
          cp App/Sources/Engine/Supertonic/Helper.swift \
             Tests/SupertonicSpike/Tests/SupertonicSpikeTests/Helper.swift
          echo "Spike compiles the exact vendored file the app ships ($(wc -l < Tests/SupertonicSpike/Tests/SupertonicSpikeTests/Helper.swift) lines)"

      - name: Run Supertonic spike test
        run: |
          set -o pipefail
          cd Tests/SupertonicSpike
          swift test 2>&1 | tee ../../supertonic-spike.log

      - name: Show failure summary
        if: always()
        run: |
          grep -E "SUPERTONIC-SPIKE|error:|failed|Fatal|Crash|unexpected exit|Executed" supertonic-spike.log \
            | grep -vE "warning:" \
            | tail -n 40 > supertonic-summary.txt || true
          echo "----- SUPERTONIC SPIKE SUMMARY -----"
          cat supertonic-summary.txt
          echo "------------------------------------"
          if [ -s supertonic-summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('supertonic-summary.txt').read_text()[:5500]; print('::error title=Supertonic spike failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Upload sample audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-sample
          path: ~/supertonic-spike/sample.wav
          if-no-files-found: error

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-spike-log
          path: supertonic-spike.log
          if-no-files-found: warn

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # One of our SPM dependencies declares `type: .dynamic` in its
      # manifest (MisakiSwift 1.0.6, our G2P).
      # Dynamic SPM products become unembedded *.framework refs that crash at
      # launch inside LiveContainer ("Library not loaded: @rpath/…"), so we
      # strip that declaration from EVERY package checkout before building.
      # Pins in Package.resolved are untouched — same versions, static linkage.
      - name: Patch SPM packages to link statically
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SpeechnotesIOS.xcodeproj \
            -scheme SpeechnotesIOS \
            -derivedDataPath build/DerivedData >/dev/null
          CHECKOUTS=build/DerivedData/SourcePackages/checkouts
          test -d "$CHECKOUTS" || { echo "::error::package checkouts not found at $CHECKOUTS"; exit 1; }
          PATCHED=0
          for MANIFEST in "$CHECKOUTS"/*/Package.swift; do
            if grep -q "type: .dynamic" "$MANIFEST"; then
              sed -i '' "/type: .dynamic/d" "$MANIFEST"
              echo "Patched to static: $(basename "$(dirname "$MANIFEST")")"
              PATCHED=$((PATCHED + 1))
            fi
          done
          echo "$PATCHED package manifest(s) patched."
          # The verify step after the archive enforces the outcome; a count of
          # 0 here is fine (upstream may have fixed their manifests).

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SpeechnotesIOS.xcodeproj \
            -scheme SpeechnotesIOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpeechnotesIOS.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee archive.log

      # Belt-and-braces: the ONLY thing that kills LiveContainer is the app
      # binary carrying load commands for frameworks that aren't properly
      # embedded/signed. otool -L of the main binary is authoritative — fail
      # on any dependency outside /usr/lib and /System. SPM binaryTarget
      # frameworks get copied into Frameworks/ even when static (ONNX
      # Runtime's iOS slice is a static ar archive); unreferenced copies are
      # dead weight, so strip them and log what they were.
      - name: Verify app links no external frameworks + strip dead Frameworks/ copies (LiveContainer requirement)
        if: success()
        run: |
          APP=$(find build/SpeechnotesIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "--- .app overview ---"
          du -sh "$APP"
          ls "$APP"
          BIN="$APP/Speechnotes"
          echo "--- otool -L (system deps only is OK) ---"
          otool -L "$BIN"
          DEPS=$(otool -L "$BIN" | tail -n +2 | grep -vE '^[[:space:]]*/usr/lib/|^[[:space:]]*/System/' || true)
          if [ -n "$DEPS" ]; then
            echo "$DEPS"
            echo "::error::App binary references non-system frameworks/dylibs (see above) — LiveContainer will crash on launch (dyld Library not loaded). All SPM deps must link statically."
            exit 1
          fi
          if [ -d "$APP/Frameworks" ]; then
            echo "--- Frameworks/ contents ---"; ls -la "$APP/Frameworks"
            shopt -s nullglob
            for FW in "$APP/Frameworks"/*; do
              NAME=$(basename "$FW")
              if [ -d "$FW" ] && [[ "$NAME" == *.framework ]]; then
                MACHO="$FW/${NAME%.framework}"
              else
                MACHO="$FW"
              fi
              if [ -f "$MACHO" ]; then
                echo "--- $NAME: file(1) ---"; file "$MACHO"
                echo "--- $NAME: otool -L ---"; otool -L "$MACHO" || true
              fi
              echo "Stripping unreferenced $NAME from Frameworks/ (no load command points at it)"
              rm -rf "$FW"
            done
            rmdir "$APP/Frameworks" 2>/dev/null || true
          fi
          echo "OK: only system dependencies; Frameworks/ empty or removed"

      - name: Show archive failure summary
        if: failure()
        run: |
          grep -E "error:|fatal error|Assertion|Undefined symbol|Testing failed" archive.log \
            | grep -vE "warning:" \
            | tail -n 40 > build-summary.txt || true
          echo "----- BUILD FAILURE SUMMARY (last 40 matching lines) -----"
          cat build-summary.txt
          echo "-----------------------------------------------------------"
          if [ -s build-summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('build-summary.txt').read_text()[:5500]; print('::error title=App build failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Package unsigned IPA
        if: success()
        run: ./Scripts/package-ipa.sh build/SpeechnotesIOS.xcarchive

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpeechnotesIOS
          path: dist/SpeechnotesIOS.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: archive.log
          if-no-files-found: warn
