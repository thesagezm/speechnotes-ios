name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kokoro-spike:
    name: Kokoro spike (experimental — non-blocking)
    runs-on: macos-latest
    timeout-minutes: 30
    # Experimental side-quest: proves Kokoro generation in CI. Failures here
    # must never block or worry us — the app is tested on the real device.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Kokoro model + voices
        uses: actions/cache@v4
        with:
          path: ~/kokoro-spike
          key: kokoro-models-v1-327115152

      - name: Download model + voices (if not cached)
        run: |
          mkdir -p ~/kokoro-spike
          if [ ! -f ~/kokoro-spike/kokoro-v1_0.safetensors ]; then
            curl -L --retry 3 --progress-bar \
              -o ~/kokoro-spike/kokoro-v1_0.safetensors \
              https://media.githubusercontent.com/media/mlalma/KokoroTestApp/main/Resources/kokoro-v1_0.safetensors
          fi
          if [ ! -f ~/kokoro-spike/voices.npz ]; then
            curl -L --retry 3 --progress-bar \
              -o ~/kokoro-spike/voices.npz \
              https://raw.githubusercontent.com/mlalma/KokoroTestApp/main/Resources/voices.npz
          fi
          ls -lh ~/kokoro-spike

      - name: Run Kokoro spike test
        run: |
          set -o pipefail
          cd Tests/KokoroSpike
          swift test 2>&1 | tee ../../spike.log

      - name: Show failure summary
        if: always()
        run: |
          tail -n 400 spike.log > spike-tail.txt
          grep -E "KOKORO-SPIKE|Test Suite|Test Case|Test session|error:|failed|Fatal|Crash|unexpected exit|Assertion|Metal|Executed" spike-tail.txt \
            | grep -vE "WriteAuxiliaryFile|builtin-|warning:" \
            | tail -n 40 > summary.txt || true
          echo "----- FAILURE SUMMARY (last 40 matching lines) -----"
          cat summary.txt
          echo "----------------------------------------------------"
          if [ -s summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('summary.txt').read_text()[:5500]; print('::error title=Kokoro spike test failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Upload sample audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-sample
          path: ~/kokoro-spike/sample.wav
          if-no-files-found: error

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-spike-log
          path: |
            spike.log
            spike-tail.txt
          if-no-files-found: warn

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # KokoroSwift's manifest declares `type: .dynamic`, which produces an
      # unembedded KokoroSwift.framework that crashes at launch inside
      # LiveContainer ("Library not loaded: @rpath/KokoroSwift.framework").
      # LiveContainer needs a fully static binary, so we delete that one line
      # from the package checkout before building. Pins in Package.resolved
      # are untouched, so the build still uses KokoroSwift 1.0.11.
      - name: Patch KokoroSwift to link statically
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SpeechnotesIOS.xcodeproj \
            -scheme SpeechnotesIOS \
            -derivedDataPath build/DerivedData >/dev/null
          MANIFEST=build/DerivedData/SourcePackages/checkouts/kokoro-ios/Package.swift
          test -f "$MANIFEST" || { echo "::error::kokoro-ios checkout not found at $MANIFEST"; exit 1; }
          if grep -q "type: .dynamic" "$MANIFEST"; then
            sed -i '' "/type: .dynamic,/d" "$MANIFEST"
            echo "Patched KokoroSwift to a static library:"
            grep -A3 "\.library(" "$MANIFEST" | head -5
          else
            echo "KokoroSwift no longer declares .dynamic — patch not needed (upstream fixed it?)"
          fi

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SpeechnotesIOS.xcodeproj \
            -scheme SpeechnotesIOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpeechnotesIOS.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee archive.log

      # Belt-and-braces: if anything ever links dynamically again, fail here
      # with a clear message instead of crashing on the phone at launch.
      - name: Verify app is fully static (LiveContainer requirement)
        if: success()
        run: |
          APP=$(find build/SpeechnotesIOS.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -n 1)
          echo "--- .app overview ---"
          du -sh "$APP"
          ls "$APP"
          if [ -d "$APP/Frameworks" ]; then
            echo "--- Frameworks/ contents ---"; ls -la "$APP/Frameworks"
          fi
          BIN="$APP/Speechnotes"
          echo "--- non-system dylib dependencies (must be empty) ---"
          DEPS=$(otool -L "$BIN" | grep "@rpath/" || true)
          echo "${DEPS:-<none>}"
          if [ -n "$DEPS" ] || [ -d "$APP/Frameworks" ]; then
            echo "::error::App references embedded frameworks — LiveContainer will crash on launch (dyld Library not loaded). All SPM deps must link statically."
            exit 1
          fi
          echo "OK: no @rpath framework dependencies"

      - name: Show archive failure summary
        if: failure()
        run: |
          grep -E "error:|fatal error|Assertion|Undefined symbol|Testing failed" archive.log \
            | grep -vE "warning:" \
            | tail -n 40 > build-summary.txt || true
          echo "----- BUILD FAILURE SUMMARY (last 40 matching lines) -----"
          cat build-summary.txt
          echo "-----------------------------------------------------------"
          if [ -s build-summary.txt ]; then
            python3 -c "import pathlib; t = pathlib.Path('build-summary.txt').read_text()[:5500]; print('::error title=App build failure::' + t.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))"
          fi

      - name: Package unsigned IPA
        if: success()
        run: ./Scripts/package-ipa.sh build/SpeechnotesIOS.xcarchive

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SpeechnotesIOS
          path: dist/SpeechnotesIOS.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: archive.log
          if-no-files-found: warn
