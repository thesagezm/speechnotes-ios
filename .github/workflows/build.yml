name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kokoro-spike:
    name: Kokoro engine spike (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Kokoro model + voices
        uses: actions/cache@v4
        with:
          path: ~/kokoro-spike
          key: kokoro-models-v1-327115152

      - name: Download model + voices (if not cached)
        run: |
          mkdir -p ~/kokoro-spike
          if [ ! -f ~/kokoro-spike/kokoro-v1_0.safetensors ]; then
            curl -L --retry 3 --progress-bar \
              -o ~/kokoro-spike/kokoro-v1_0.safetensors \
              https://media.githubusercontent.com/media/mlalma/KokoroTestApp/main/Resources/kokoro-v1_0.safetensors
          fi
          if [ ! -f ~/kokoro-spike/voices.npz ]; then
            curl -L --retry 3 --progress-bar \
              -o ~/kokoro-spike/voices.npz \
              https://raw.githubusercontent.com/mlalma/KokoroTestApp/main/Resources/voices.npz
          fi
          ls -lh ~/kokoro-spike

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run Kokoro spike test
        run: |
          set -o pipefail
          xcodebuild test \
            -project SpeechnotesIOS.xcodeproj \
            -scheme KokoroSpike \
            -destination 'platform=OS X' \
            2>&1 | tee spike.log

      - name: Upload sample audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-sample
          path: ~/kokoro-spike/sample.wav
          if-no-files-found: error

      - name: Upload spike log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-spike-log
          path: spike.log
          if-no-files-found: warn

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned, generic iOS device)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SpeechnotesIOS.xcodeproj \
            -scheme SpeechnotesIOS \
            -destination 'generic/platform=iOS' \
            -archivePath build/SpeechnotesIOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee archive.log

      - name: Package unsigned IPA
        run: ./Scripts/package-ipa.sh build/SpeechnotesIOS.xcarchive

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeechnotesIOS
          path: dist/SpeechnotesIOS.ipa
          if-no-files-found: error
