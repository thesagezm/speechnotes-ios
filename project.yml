name: SpeechnotesIOS
options:
  bundleIdPrefix: com.speechnotes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  SpeechLogic:
    path: Packages/SpeechLogic
  MisakiSwift:
    url: https://github.com/mlalma/MisakiSwift.git
    exactVersion: "1.0.6"
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.30.2"
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: "0.0.6"
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: "0.9.0"
targets:
  SpeechnotesIOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SpeechLogic
      - package: MisakiSwift
        product: MisakiSwift
      - package: OnnxRuntime
        product: onnxruntime
      - package: MLX
      - package: MLXUtilsLibrary
      - package: WhisperKit
        product: WhisperKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Speechnotes
        UILaunchScreen: {}
        # Portrait-only: the v1.2.0 release added LandscapeLeft/Right here and
        # the build black-screened at launch inside LiveContainer on iOS 26
        # (v1.1 differs ONLY by these keys — verified byte-level 2026-08-18).
        # Re-add only with a device-tested LiveContainer-safe plan.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: Markdown file
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        CFBundleURLTypes:
          - CFBundleURLName: com.speechnotes.ios
            CFBundleURLSchemes: [speechnotes]
            CFBundleURLRole: Viewer
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: ''
        NSMicrophoneUsageDescription: 'Speechnotes uses the microphone to transcribe speech into text while you dictate notes.'
        NSSpeechRecognitionUsageDescription: 'Speechnotes uses speech recognition to convert your voice to text when you dictate notes.'
    settings:
      base:
        PRODUCT_NAME: Speechnotes
        PRODUCT_BUNDLE_IDENTIFIER: com.speechnotes.ios
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "25"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  SpeechnotesIOS:
    build:
      targets:
        SpeechnotesIOS: all
    run:
      config: Debug
    archive:
      config: Release
