name: SpeechnotesIOS
options:
  bundleIdPrefix: com.speechnotes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  SpeechLogic:
    path: Packages/SpeechLogic
  MisakiSwift:
    url: https://github.com/mlalma/MisakiSwift.git
    exactVersion: "1.0.6"
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.30.2"
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: "0.0.6"
targets:
  SpeechnotesIOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SpeechLogic
      - package: MisakiSwift
        product: MisakiSwift
      - package: OnnxRuntime
        product: onnxruntime
      - package: MLX
      - package: MLXUtilsLibrary
      # The share sheet entry point. GATED OFF (embed: false): LiveContainer
      # hosts NO app extensions (Docs/PLAN.md §2), so the .appex can never
      # function there, and shipping an unsigned PlugIns/ copy into the LC
      # guest bundle is an unverified signing risk to the primary install
      # path. The target still BUILDS in CI (compile coverage); the IPA stays
      # extension-free. Flip to embed: true only with the user's say-so, and
      # only behind an LC install smoke test. No App Group either way — the
      # extension hands off through the speechnotes:// scheme, which needs
      # no entitlement, so SideStore's free-account provisioning is enough.
      - target: ShareExtension
        embed: false
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Speechnotes
        # Literal version in the GENERATED plist: without these keys the
        # packaged IPA had no version at all and iOS reported 1.0 (About read
        # a hardcoded string before, which masked it). Bump together with
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION below on every release.
        CFBundleShortVersionString: "1.8.1"
        CFBundleVersion: "47"
        UILaunchScreen: {}
        # BookDrop (LocalSend): the local-network permission prompt copy, and
        # the ATS exception the SENDER needs — discovery and upload POST to
        # plain http://<lan-ip>:533xx, which ATS blocks without
        # NSAllowsLocalNetworking (covers IP-address/local hosts; it does not
        # loosen anything off-LAN). The receive side needs no multicast
        # entitlement and no NSBonjourServices: we never multicast.
        NSLocalNetworkUsageDescription: "BookDrop finds nearby devices on your local network to send and receive books and notes. Nothing leaves the network."
        # ONE dictionary, two keys: NSAllowsLocalNetworking is the BookDrop
        # sender's exception (discovery + upload POST to plain http://<lan-ip>),
        # NSAllowsArbitraryLoads is the web-article importer's browser-grade
        # fetch (pages from arbitrary hosts, some http-only or redirecting
        # through TLS that ATS would otherwise reject). Declaring the key twice
        # used to let the second dictionary silently overwrite the first and
        # break the LAN sender.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        # v1.6.1 probe (device-gated): landscape keys were re-added in v1.2.0
        # and that build black-screened at launch inside LiveContainer on iOS 26
        # (v1.1 differs ONLY by these keys — verified byte-level 2026-08-18, see
        # Docs/BUILD-FAILURES-V1.2.md). This probe ships the keys ALONE — no
        # code change in the same commit — so a device black-screen has exactly
        # one suspect. If it fails, revert these two lines and landscape stays
        # dormant until a device-tested LiveContainer-safe route exists.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Files app: the app's Documents folder appears under
        # "On My iPhone → Speechnotes" and can be worked with directly
        # (Notes/, Books/, exports). UIFileSharingEnabled is what exposes
        # the folder at all; LSSupportsOpeningDocumentsInPlace tells iOS to
        # grant real in-place access instead of routing every file through
        # an Inbox copy — without it, a file edited in Files would not be
        # seen here.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: Markdown file
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          # v1.4.2 Books: the one planned exception to "project.yml unchanged"
          # (Docs/PLAN-V1.4.2-EBOOKS.md) — lets Open-In send epubs here.
          - CFBundleTypeName: EPUB document
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          # Audiobooks: an M4B/M4A is mpeg4 audio, an MP3 is public.mp3, and the
          # Opus/Ogg containers are what store books arrive in when no
          # DRM-less M4B exists. The importer reads chapters from the file's
          # own metadata.
          - CFBundleTypeName: Audiobook
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.mpeg4-audio, public.mp3, org.opus-audio, org.xiph.ogg]
          # Document formats that normalize to EPUB at import (DocumentBook):
          # the office set plus the mobipocket/Kindle, FictionBook, RTF, web
          # and plain-text readers. Declared so "Open In" can hand them here —
          # the ones with no system UTI are declared as app-owned types, which
          # is the only way to claim them.
          - CFBundleTypeName: Word document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              [org.openxmlformats.wordprocessingml.document, com.microsoft.word.doc]
          - CFBundleTypeName: OpenDocument text
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.oasis.opendocument.text]
          - CFBundleTypeName: Presentation
            LSHandlerRank: Alternate
            LSItemContentTypes:
              [org.openxmlformats.presentationml.presentation, org.oasis.opendocument.presentation]
          - CFBundleTypeName: Kindle book
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.amazon.azw, com.amazon.azw3, com.apple.mobibook]
          - CFBundleTypeName: FictionBook
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.fictionbook.fb2, org.speechnotes.fb2]
          - CFBundleTypeName: Rich Text document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.apple.rtf]
          - CFBundleTypeName: Web page
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.html, org.speechnotes.htmlz]
          # The catch-all that makes the app appear in EVERY share sheet and
          # "Open In" menu — a website URL, a .pptx from an app that tags its
          # files with a type none of the rows above name, whatever comes
          # next. The receiver (NotesList.handleOpenURL) still validates per
          # file and shows "Unsupported file type" for junk, so this widens
          # VISIBILITY, not acceptance. public.url is what Safari hands over
          # when the user shares a page.
          - CFBundleTypeName: Any file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.data]
          - CFBundleTypeName: URL
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.url]
        CFBundleURLTypes:
          - CFBundleURLName: com.speechnotes.ios
            CFBundleURLSchemes: [speechnotes]
            CFBundleURLRole: Viewer
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_NAME: Speechnotes
        PRODUCT_BUNDLE_IDENTIFIER: com.speechnotes.ios
        # Keep CFBundleShortVersionString / CFBundleVersion in info.properties
        # above in sync — release bump touches all three.
        MARKETING_VERSION: "1.8.1"
        CURRENT_PROJECT_VERSION: "47"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension/Sources
    dependencies:
      # WebArticle.url(in:) — the SAME strict shared-text → URL parser the
      # app's import channels use, so the extension and the app agree on
      # what counts as a link.
      - package: SpeechLogic
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Speechnotes
        # Derive from the app's build settings so a release bump stays a
        # two-file edit (version-check.sh guards the app pair; these expand
        # at archive time).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          # The Xcode-template form: Swift classes register as
          # Module.Class — this target's module name is ShareExtension.
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Pages (public.url) and text (selected text, pasted links).
            # One item of each, nothing else — public.webpage (full saved
            # pages) stays OFF: those already route through the app's
            # Open-In document types, where the file importer can use the
            # bytes; here they'd extract to nothing.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsTextWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechnotes.ios.Share
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
schemes:
  SpeechnotesIOS:
    build:
      targets:
        SpeechnotesIOS: all
        # Build-only: the extension compiles with every archive (compile
        # coverage) but nothing embeds it — the app's dependency is embed:
        # false, so the Archive action stays single-product (the app) and
        # the packaged IPA carries no PlugIns/ (LiveContainer constraint).
        ShareExtension:
          build: true
    run:
      config: Debug
    archive:
      config: Release
