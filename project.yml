name: SpeechnotesIOS
options:
  bundleIdPrefix: com.speechnotes
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  SpeechLogic:
    path: Packages/SpeechLogic
  MisakiSwift:
    url: https://github.com/mlalma/MisakiSwift.git
    exactVersion: "1.0.6"
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  KokoroSwift:
    url: https://github.com/mlalma/kokoro-ios
    exactVersion: "1.0.11"
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.30.2"
  MLXUtilsLibrary:
    url: https://github.com/mlalma/MLXUtilsLibrary.git
    exactVersion: "0.0.6"
targets:
  SpeechnotesIOS:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: SpeechLogic
      - package: MisakiSwift
        product: MisakiSwift
      - package: OnnxRuntime
        product: onnxruntime
      - package: KokoroSwift
      - package: MLX
      - package: MLXUtilsLibrary
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Speechnotes
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: Markdown file
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: PDF document
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        CFBundleURLTypes:
          - CFBundleURLName: com.speechnotes.ios
            CFBundleURLSchemes: [speechnotes]
            CFBundleURLRole: Viewer
    settings:
      base:
        PRODUCT_NAME: Speechnotes
        PRODUCT_BUNDLE_IDENTIFIER: com.speechnotes.ios
        MARKETING_VERSION: "0.6.2"
        CURRENT_PROJECT_VERSION: "10"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  SpeechnotesIOS:
    build:
      targets:
        SpeechnotesIOS: all
    run:
      config: Debug
    archive:
      config: Release
